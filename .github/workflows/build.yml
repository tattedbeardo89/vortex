name: Build Vortex
on:
  workflow_dispatch:
    inputs:
      create_draft:
        description: Create or update a draft release after verification (never publishes)
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: vortex-release-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned-compatible toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18 llvm-18-dev cmake ninja-build nasm pkg-config zlib1g-dev zstd zip exfatprogs exfat-fuse
          python3 -m pip install -r ps5-react/requirements.txt
          npm ci --ignore-scripts --prefix ps5-react
      - uses: actions/cache@v4
        with:
          path: ps5-react/.deps
          key: vortex-native-${{ hashFiles('ps5-react/dependencies.lock.json') }}
      - name: Validate branding, updater and existing application tests
        run: |
          npm run test:vortex
          npm run test:app
      - name: Build and package Vortex
        run: npm run build
      - name: Verify update package and version consistency
        run: python3 custom/vortex/package_update.py --verify
      - name: Collect reports and source snapshot
        run: |
          mkdir -p .vortex/release
          cp Vortex.exfat update.zip vortex-update.json .vortex/release/
          cp .vortex/validation.json ps5-react/dist/PPSA99189.receipt.json .vortex/release/
          git archive --format=tar --output=.vortex/release/Vortex-source.tar HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: Vortex
          include-hidden-files: true
          path: .vortex/release/
          if-no-files-found: error
  draft-release:
    needs: build
    if: inputs.create_draft && github.repository == 'tattedbeardo89/vortex'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Vortex
          path: .vortex/release
      - name: Create a reviewable draft, never publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 custom/vortex/draft_release.py --assets-dir .vortex/release
