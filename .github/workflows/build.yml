name: Build Vortex
on:
  workflow_dispatch:
    inputs:
      create_draft:
        description: Create or update a draft release after verification (never publishes)
        type: boolean
        default: false
      verify_run_id:
        description: Optional successful run to verify instead of building (no release)
        type: string
        default: ''
      verify_artifact_name:
        description: Artifact to independently inspect when verify_run_id is provided
        type: string
        default: Vortex-native-validation
permissions:
  contents: read
concurrency:
  group: vortex-release-build
  cancel-in-progress: false
jobs:
  verify-artifacts:
    if: inputs.verify_run_id != ''
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/verify-artifacts.yml
    with:
      run_id: ${{ inputs.verify_run_id }}
      artifact_name: ${{ inputs.verify_artifact_name }}
  build:
    if: inputs.verify_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record a fixed application build timestamp
        run: echo "VORTEX_BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Install pinned-compatible toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18 llvm-18-dev cmake ninja-build nasm pkg-config zlib1g-dev zstd zip exfatprogs exfat-fuse
          python3 -m pip install -r ps5-react/requirements.txt
          npm ci --ignore-scripts --prefix ps5-react
      - uses: actions/cache@v4
        with:
          path: ps5-react/.deps
          key: vortex-native-${{ hashFiles('ps5-react/dependencies.lock.json') }}
      - name: Validate branding, updater and existing application tests
        run: |
          npm run test:vortex
          npm run test:app
          npm run test:parity
          npm run test:web
          npm run build:web
      - name: Build and package Vortex
        run: npm run build
      - name: Verify update package and version consistency
        run: python3 custom/vortex/package_update.py --verify
      - name: Collect reports and source snapshot
        run: |
          mkdir -p .vortex/release
          cp Vortex.exfat update.zip vortex-update.json .vortex/release/
          cp .vortex/web-frontend.json .vortex/validation.json .vortex/catalog-parity.json custom/vortex/upstream-baseline.json ps5-react/dist/PPSA99189.receipt.json .vortex/release/
          mkdir -p .vortex/release/metadata .vortex/release/branding
          cp ps5-react/dist/PPSA99189/VORTEX-BUILD.json ps5-react/dist/PPSA99189/VORTEX-BRANDING.json ps5-react/dist/PPSA99189/VORTEX-WEB.json .vortex/release/metadata/
          cp ps5-react/dist/PPSA99189/sce_sys/icon0.png ps5-react/dist/PPSA99189/sce_sys/pic0.dds ps5-react/dist/PPSA99189/sce_sys/pic1.dds .vortex/release/branding/
          git archive --format=tar --output=.vortex/release/Vortex-source.tar HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: Vortex
          include-hidden-files: true
          path: .vortex/release/
          if-no-files-found: error
  draft-release:
    needs: build
    if: inputs.create_draft && github.repository == 'tattedbeardo89/vortex'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Vortex
          path: .vortex/release
      - name: Create a reviewable draft, never publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 custom/vortex/draft_release.py --assets-dir .vortex/release
