name: upstream-sync
on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:
    inputs:
      validation_only:
        description: Read-only compatibility validation of this ref; do not integrate or open upstream PRs
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: vortex-upstream-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'tattedbeardo89/vortex' && !inputs.validation_only
    runs-on: ubuntu-24.04
    outputs:
      branch: ${{ steps.integrate.outputs.branch }}
      sha: ${{ steps.integrate.outputs.sha }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked test dependencies
        run: |
          python3 -m pip install -r ps5-react/requirements.txt
          npm ci --ignore-scripts --prefix ps5-react
      - name: Merge upstream, validate and open or update a draft PR
        id: integrate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 custom/vortex/sync.py
  validate-integration:
    needs: sync
    if: always() && (inputs.validation_only || needs.sync.outputs.branch != '')
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read
      actions: read
    with:
      target_ref: ${{ inputs.validation_only && github.sha || needs.sync.outputs.sha }}
