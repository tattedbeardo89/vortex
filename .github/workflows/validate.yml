name: Vortex validation
on:
  pull_request:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Optional branch to validate
        type: string
        default: ''
      package_image:
        description: Also build Vortex.exfat and update.zip on the hosted Linux runner
        type: boolean
        default: false
  workflow_call:
    inputs:
      target_ref:
        type: string
        required: false
        default: ''
      package_image:
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: vortex-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  identity-and-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --prefix ps5-react
      - run: npm run test:vortex
      - name: Fetch pinned upstream catalog comparison snapshot
        run: git fetch --no-tags https://github.com/MyLuxy/overdrive.git c7e962db9a971a407f61d70473fade417de735ec
      - run: npm run test:catalog
      - run: npm run diagnose:catalog
      - run: npm run test:app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Vortex-validation
          include-hidden-files: true
          path: |
            .vortex/validation.json
            .vortex/catalog-parity.json
            custom/vortex/upstream-baseline.json
  native-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PS5 build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18 llvm-18-dev cmake ninja-build nasm pkg-config zlib1g-dev zstd exfatprogs exfat-fuse zip
          python3 -m pip install -r ps5-react/requirements.txt
          npm ci --ignore-scripts --prefix ps5-react
      - uses: actions/cache@v4
        with:
          path: ps5-react/.deps
          key: vortex-native-${{ hashFiles('ps5-react/dependencies.lock.json') }}
      - name: Build native app
        if: ${{ !inputs.package_image }}
        run: npm run build:app
      - name: Build and verify Vortex image/update package
        if: inputs.package_image
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Vortex-native-validation
          include-hidden-files: true
          path: |
            .vortex/validation.json
            ps5-react/dist/*.receipt.json
            Vortex.exfat
            update.zip
            vortex-update.json
  framework-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native preview prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake nasm ninja-build pkg-config libsdl2-dev libgl-dev libcurl4-openssl-dev libarchive-dev libarchive-tools liblzma-dev libssl-dev zlib1g-dev xvfb xauth
          python3 -m pip install -r ps5-react/requirements.txt
          npm ci --ignore-scripts --prefix ps5-react
      - uses: actions/cache@v4
        with:
          path: ps5-react/.deps
          key: vortex-desktop-${{ hashFiles('ps5-react/dependencies.lock.json') }}
      - name: Run original framework suite without suppressing inherited failures
        run: xvfb-run -a -s '-screen 0 1920x1080x24' npm run test:framework
